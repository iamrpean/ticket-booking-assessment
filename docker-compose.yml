services:
  app:
    build: .
    environment:
      DATABASE_URL: postgres://ticket:ticket@db:5432/ticket?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-8080}:8080"
      - "${MOCK_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ticket
      POSTGRES_PASSWORD: ticket
      POSTGRES_DB: ticket
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
